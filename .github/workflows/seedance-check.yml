name: Verify Seedance connection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seedance-check.yml'
      - 'scripts/check-seedance.mjs'

permissions:
  contents: read

jobs:
  check:
    name: Read-only Seedance credential check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify authentication without generating video
        run: node scripts/check-seedance.mjs
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
      - name: Check public API connectivity if verification failed
        if: failure()
        run: >-
          node --input-type=module -e "import { probeSeedanceKey } from './scripts/check-seedance.mjs'; const result = await probeSeedanceKey({ apiKey: 'connectivity-check-not-a-real-key' }); console.log('PUBLIC_ARK_ROUTE', JSON.stringify(result));"
